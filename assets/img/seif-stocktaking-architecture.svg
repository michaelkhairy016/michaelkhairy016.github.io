<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Seif Stocktaking architecture: Android handheld fleet syncing through branch PCs to a central on-prem portal and PostgreSQL database, producing variance, netting, movement and KPI reports.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B2545"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
  </defs>

  <!-- ============ Handheld fleet ============ -->
  <g>
    <rect x="30" y="80" width="200" height="190" rx="12" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.5"/>
    <text x="130" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Branch handhelds</text>
    <text x="130" y="126" text-anchor="middle" font-size="15.5" fill="#5B6B7C">SeifScanner · Android</text>
    <!-- device icons -->
    <g stroke="#0B2545" stroke-width="1.6" fill="#F4F8FB">
      <rect x="52" y="138" width="42" height="70" rx="7"/>
      <rect x="109" y="138" width="42" height="70" rx="7"/>
      <rect x="166" y="138" width="42" height="70" rx="7"/>
    </g>
    <g stroke="#0D9488" stroke-width="1.4" fill="none">
      <line x1="60" y1="150" x2="86" y2="150"/>
      <line x1="117" y1="150" x2="143" y2="150"/>
      <line x1="174" y1="150" x2="200" y2="150"/>
    </g>
    <text x="130" y="232" text-anchor="middle" font-size="13.5" fill="#0F766E">Offline-first · PIN-signed scans</text>
    <text x="130" y="250" text-anchor="middle" font-size="13.5" fill="#0F766E">Unknown item → photo → portal review</text>
  </g>

  <!-- ============ Branch PC ============ -->
  <g>
    <rect x="280" y="80" width="200" height="190" rx="12" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.5"/>
    <text x="380" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Branch PC</text>
    <text x="380" y="126" text-anchor="middle" font-size="15.5" fill="#5B6B7C">one-click installer kit</text>
    <g font-size="15.5" fill="#1F2933">
      <text x="300" y="156">• Offline branch portal</text>
      <text x="300" y="178">• Nightly backup</text>
      <text x="300" y="200">• New branch live</text>
      <text x="310" y="218">in minutes</text>
    </g>
    <text x="380" y="250" text-anchor="middle" font-size="13.5" fill="#0F766E">Sync token baked in at install</text>
  </g>

  <!-- ============ Central portal ============ -->
  <g>
    <rect x="530" y="50" width="320" height="200" rx="12" fill="#0B2545"/>
    <text x="690" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Central portal — on company servers</text>
    <text x="690" y="100" text-anchor="middle" font-size="15.5" fill="#9FB3CE">ASP.NET Core Razor · SignalR live reports</text>
    <g font-size="15.5" fill="#DCE5EE">
      <text x="560" y="128">Events · devices · users &amp; roles</text>
      <text x="560" y="150">Variance engine · over/short netting</text>
      <text x="560" y="172">Monthly KPI scorecards per counter</text>
      <text x="560" y="194">Unmatched-item review workflow</text>
    </g>
    <text x="690" y="230" text-anchor="middle" font-size="13.5" fill="#14B8A6">On-prem · offline-tolerant · full data sovereignty</text>
  </g>

  <!-- ============ Database ============ -->
  <g>
    <rect x="530" y="300" width="150" height="100" rx="12" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.5"/>
    <g fill="none" stroke="#0D9488" stroke-width="1.6">
      <ellipse cx="585" cy="330" rx="22" ry="8"/>
      <path d="M563,330 v26 a22,8 0 0 0 44,0 v-26"/>
    </g>
    <text x="625" y="336" font-size="15.5" font-weight="700" fill="#0B2545">PostgreSQL</text>
    <text x="545" y="378" font-size="13.5" fill="#5B6B7C">versioned schema · nightly backups</text>
  </g>

  <!-- ============ Reports ============ -->
  <g>
    <rect x="710" y="300" width="140" height="100" rx="12" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.5"/>
    <text x="780" y="326" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0B2545">Reports &amp; KPIs</text>
    <g font-size="13.5" fill="#1F2933">
      <text x="730" y="348">Variance</text>
      <text x="730" y="364">Netting</text>
      <text x="730" y="380">Movement PDFs</text>
    </g>
  </g>

  <g>
    <rect x="710" y="440" width="140" height="40" rx="20" fill="#0D9488" fill-opacity="0.12" stroke="#0D9488" stroke-width="1.2"/>
    <text x="780" y="464" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0F766E">Commercial dept.</text>
  </g>

  <!-- ============ Arrows ============ -->
  <g stroke="#0B2545" stroke-width="1.6" fill="none">
    <line x1="232" y1="170" x2="276" y2="170" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="482" y1="170" x2="526" y2="170" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="605" y1="252" x2="605" y2="296" marker-end="url(#arr)"/>
    <line x1="780" y1="252" x2="780" y2="296" marker-end="url(#arr)"/>
    <line x1="780" y1="402" x2="780" y2="436" marker-end="url(#arrTeal)"/>
  </g>
  <g font-size="11.5" fill="#5B6B7C">
    <text x="254" y="158" text-anchor="middle">Wi-Fi sync</text>
    <text x="504" y="158" text-anchor="middle">kits + sync</text>
  </g>
</svg>
