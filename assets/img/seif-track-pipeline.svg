<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Seif Track pipeline: daily Excel sheets flow through automatic sheet detection into a PostgreSQL tracker, producing branch rankings, escalation alerts, a geo map of Egypt and late-shipment reports.">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B2545"/>
    </marker>
  </defs>

  <!-- ============ Daily sheets ============ -->
  <text x="30" y="44" font-size="15.5" font-weight="700" letter-spacing="1.4" fill="#0F766E">DAILY EXCEL SHEETS</text>
  <g font-size="15.5" fill="#1F2933">
    <g>
      <rect x="30"  y="58"  width="120" height="30" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
      <text x="90"  y="77"  text-anchor="middle">In-transit</text>
      <rect x="30"  y="96"  width="120" height="30" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
      <text x="90"  y="115" text-anchor="middle">Returns</text>
      <rect x="30"  y="134" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
      <text x="90"  y="153" text-anchor="middle">Preparation</text>
      <rect x="30"  y="172" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
      <text x="90"  y="191" text-anchor="middle">Transfers</text>
    </g>
    <g>
      <rect x="162" y="58"  width="120" height="30" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
      <text x="222" y="77"  text-anchor="middle">Transactions</text>
      <rect x="162" y="96"  width="120" height="30" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
      <text x="222" y="115" text-anchor="middle">Fees</text>
      <rect x="162" y="134" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
      <text x="222" y="153" text-anchor="middle">Expenses</text>
      <rect x="162" y="172" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
      <text x="222" y="191" text-anchor="middle">KPI sheets</text>
    </g>
  </g>

  <g>
    <rect x="30" y="240" width="252" height="38" rx="19" fill="#0D9488" fill-opacity="0.12" stroke="#0D9488" stroke-width="1.2"/>
    <text x="156" y="263" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0F766E">Daily Excel in → actions out</text>
  </g>

  <!-- ============ Detection ============ -->
  <g>
    <rect x="330" y="110" width="160" height="100" rx="12" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.5"/>
    <text x="410" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Auto detection</text>
    <text x="410" y="170" text-anchor="middle" font-size="15.5" fill="#5B6B7C">9 sheet types</text>
    <text x="410" y="187" text-anchor="middle" font-size="15.5" fill="#5B6B7C">no manual sorting</text>
  </g>

  <!-- ============ Tracker DB ============ -->
  <g>
    <rect x="530" y="110" width="150" height="100" rx="12" fill="#0B2545"/>
    <text x="605" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">seif_tracking</text>
    <text x="605" y="171" text-anchor="middle" font-size="15.5" fill="#9FB3CE">PostgreSQL</text>
    <text x="605" y="190" text-anchor="middle" font-size="15.5" fill="#9FB3CE">daily jobs · history</text>
  </g>

  <!-- ============ Outputs ============ -->
  <g font-size="13.5" font-weight="600" fill="#0B2545">
    <rect x="725" y="44"  width="130" height="54" rx="10" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
    <text x="790" y="75"  text-anchor="middle">Branch rankings</text>
    <rect x="725" y="124" width="130" height="54" rx="10" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
    <text x="790" y="148" text-anchor="middle">Escalations</text>
    <text x="790" y="165" text-anchor="middle">&amp; alerts</text>
    <rect x="725" y="204" width="130" height="54" rx="10" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
    <text x="790" y="228" text-anchor="middle">Geo map of Egypt</text>
    <text x="790" y="245" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6B7C">branch network view</text>
    <rect x="725" y="284" width="130" height="54" rx="10" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1.3"/>
    <text x="790" y="308" text-anchor="middle">Late-shipment</text>
    <text x="790" y="325" text-anchor="middle">reports</text>
  </g>

  <!-- ============ Arrows ============ -->
  <g stroke="#0B2545" stroke-width="1.6" fill="none">
    <line x1="288" y1="160" x2="326" y2="160" marker-end="url(#arr2)"/>
    <line x1="492" y1="160" x2="526" y2="160" marker-end="url(#arr2)"/>
    <path d="M682,150 L703,150 L703,71  L721,71"  marker-end="url(#arr2)"/>
    <path d="M682,160 L721,160" marker-end="url(#arr2)"/>
    <path d="M682,170 L703,170 L703,231 L721,231" marker-end="url(#arr2)"/>
    <path d="M682,180 L697,180 L697,311 L721,311" marker-end="url(#arr2)"/>
  </g>
</svg>
